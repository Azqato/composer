name: Refresh Signal Miner Prices

on:
  schedule:
    # This job is the FIRST link in the weekly chain
    #   prices (Fri) -> full database (Sat) -> out-of-sample (Sun)
    # which runs in that order because each stage reads what the one before it
    # wrote. Moving any of the three means checking the other two.
    #
    # 02:07 UTC Saturday, which is Friday 7:07pm Pacific in summer and 6:07pm in
    # winter. GitHub cron is UTC only and does not follow daylight saving, so
    # the local time moves by an hour twice a year. Owner's choice, 2026-09-06;
    # was Saturday 08:07 UTC.
    #
    # Friday evening is the best slot available for this: the Friday close lands
    # at 1pm Pacific, so the file picks it up the same day rather than waiting a
    # night, and everything downstream is that much fresher. Signal Miner is a
    # research tool over multi-year history, so weekly is plenty. Offset 7
    # minutes past the hour, same rationale as refresh-rsi.yml - on-the-hour
    # (:00) is GitHub Actions' most congested slot and can be delayed for hours
    # or dropped entirely on public repos.
    - cron: '7 2 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run refresh_prices.py
        run: python scripts/refresh_prices.py

      # data/prices.json is an input to the build-time join since v1.42.1: the
      # SPY best-days baseline on each strategy page is computed from it, matched
      # to that strategy's own backtest window. Without this step a Saturday price
      # commit leaves strategy_extras.json stale against a fresh join, and
      # check_strategy_extras.py fails every deploy until the daily metrics job
      # rebuilds it that evening. Placed before the commit step and without
      # if: always(), for the same reason as the identical step in
      # update-metrics.yml: a join miss is a human configuration error, and
      # stopping here ships nothing rather than shipping something wrong.
      - name: Rebuild strategy_extras.json/.js
        run: python scripts/build_strategy_extras.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/prices.js \
            data/strategy_extras.json data/strategy_extras.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh Signal Miner prices"
            git push
          fi
