name: Refresh Out-of-Sample Stats

on:
  schedule:
    # This job is the LAST link in the weekly chain
    #   prices (Fri) -> full database (Sat) -> out-of-sample (Sun)
    # which runs in that order because each stage reads what the one before it
    # wrote. Moving any of the three means checking the other two.
    #
    # 03:07 UTC Monday, which is Sunday 8:07pm Pacific in summer and 7:07pm in
    # winter. GitHub cron is UTC only and does not follow daylight saving, so
    # the local time moves by an hour twice a year; nothing here cares.
    # Owner's choice, 2026-09-06. Offset 7 minutes past the hour for the same
    # reason as every other job here, the on-the-hour slot is GitHub's most
    # congested.
    #
    # Why last, specifically. Two inputs, and this slot is downstream of both:
    #   - The candidate set is derived from in-sample scores, so it should be
    #     derived from the freshest ones. Saturday's full refresh finishes
    #     around 06:07 UTC Sunday, about 21 hours before this starts.
    #   - The out-of-sample window ends on the last date in data/prices.json, so
    #     that file wants to be current too. Friday's price refresh puts Friday's
    #     close in it, two days before this reads it.
    #
    # Also a different DAY from refresh-full-database.yml rather than a
    # different hour, which matters on its own: that job runs 4.5 to 5 hours
    # against GitHub's 6-hour ceiling, and two long API jobs on the same day
    # against the same host is a queue nobody asked for.
    - cron: '7 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# refresh_oos.py holds no lock. Two concurrent runs each keep their own copy of
# the store in memory and rewrite the whole file at every checkpoint, so the
# slower one silently discards the faster one's rows. Observed locally on
# 2026-09-06 with two processes going at once. A manual dispatch landing on top
# of the scheduled Sunday-evening run is exactly that situation, so the second
# waits rather than racing.
concurrency:
  group: refresh-oos
  cancel-in-progress: false

jobs:
  refresh-oos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Same per-step cap and continue-on-error shape as the full refresh, and
      # for the same reason: refresh_oos.py checkpoints every 10 rows and
      # resumes from what is already on disk, so a cancelled step commits its
      # progress instead of throwing it away. The candidate set is roughly 3,200
      # calls at the 2-second throttle, about 1.8 hours, so the cap is slack
      # rather than a real constraint. It exists for the week the pool grows.
      - name: Run refresh_oos.py
        timeout-minutes: 300
        continue-on-error: true
        run: python scripts/refresh_oos.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oos.json data/oos.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh out-of-sample stats"
            git push
          fi
