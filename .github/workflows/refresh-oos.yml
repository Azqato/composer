name: Refresh Out-of-Sample Stats

on:
  schedule:
    # 03:07 UTC Saturday, which is Friday 8:07pm Pacific in summer and 7:07pm
    # in winter. GitHub cron is UTC only and does not follow daylight saving, so
    # the local time moves by an hour twice a year; nothing here cares.
    # Owner's choice, 2026-09-06. Offset 7 minutes past the hour for the same
    # reason as every other job here, the on-the-hour slot is GitHub's most
    # congested.
    #
    # Still a different DAY from refresh-full-database.yml (Sunday 01:07 UTC)
    # rather than a different hour, which is the part that matters: that job
    # runs 4.5 to 5 hours against GitHub's 6-hour ceiling, and two long API jobs
    # on the same day against the same host is a queue nobody asked for. This
    # one finishes around 05:50 UTC Saturday, roughly 19 hours clear of it.
    #
    # It now runs BEFORE the full refresh rather than after, so the candidate
    # set is derived from in-sample scores up to six days old. That is fine and
    # was checked rather than assumed: the cutoff carries a 300-point margin
    # below the protected ranks, and week-to-week score movement is nowhere near
    # that. The cost is freshness of the window end, not correctness of the
    # selection: data/prices.json is refreshed Monday, so the out-of-sample
    # window ends on the Friday close about a week before each run.
    - cron: '7 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write

# refresh_oos.py holds no lock. Two concurrent runs each keep their own copy of
# the store in memory and rewrite the whole file at every checkpoint, so the
# slower one silently discards the faster one's rows. Observed locally on
# 2026-09-06 with two processes going at once. A manual dispatch landing on top
# of the scheduled Wednesday run is exactly that situation, so the second one
# waits rather than racing.
concurrency:
  group: refresh-oos
  cancel-in-progress: false

jobs:
  refresh-oos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Same per-step cap and continue-on-error shape as the full refresh, and
      # for the same reason: refresh_oos.py checkpoints every 10 rows and
      # resumes from what is already on disk, so a cancelled step commits its
      # progress instead of throwing it away. The candidate set is roughly 3,200
      # calls at the 2-second throttle, about 1.8 hours, so the cap is slack
      # rather than a real constraint. It exists for the week the pool grows.
      - name: Run refresh_oos.py
        timeout-minutes: 300
        continue-on-error: true
        run: python scripts/refresh_oos.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oos.json data/oos.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh out-of-sample stats"
            git push
          fi
