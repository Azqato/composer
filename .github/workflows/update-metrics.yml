name: Update Backtest Metrics

on:
  schedule:
    # 21:20 UTC = 4:20pm EST / 5:20pm EDT (Friday close). Runs daily; the
    # script itself skips any strategy updated within the last 7 days, so
    # most days are a no-op except for retrying anything that failed.
    - cron: '20 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update_metrics.py
        run: python scripts/update_metrics.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/strategies.json data/strategies.js data/symphony_scores.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly backtest metrics update"
            git push
          fi
