name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate the deploy on syntax. A broken inline <script> still serves a
      # 200 with its static HTML intact, so a bad publish looks healthy from
      # the outside; v1.22.2 shipped exactly that. Failing here leaves the
      # previous, working site up.
      - name: Check inline JS syntax
        run: python3 scripts/check_html_js.py

      - name: Check the Composer export shape
        run: python3 scripts/check_composer_ladder.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build deploy folder
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='data/symphony_scores.json' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            . _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
