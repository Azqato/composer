name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate the deploy on syntax. A broken inline <script> still serves a
      # 200 with its static HTML intact, so a bad publish looks healthy from
      # the outside; v1.22.2 shipped exactly that. Failing here leaves the
      # previous, working site up.
      - name: Check inline JS syntax
        run: python3 scripts/check_html_js.py

      - name: Check the Composer export shape
        run: python3 scripts/check_composer_ladder.py

      # symphony_id is the community database's primary key, and the site reads
      # the derived summary rather than the full file. A duplicate key shows the
      # same symphony twice in every list view; a stale summary makes real
      # symphonies invisible. Both are silent without this check, and both have
      # happened (v1.25.1, v1.25.2).
      - name: Check the database primary key and summary sync
        run: python3 scripts/check_database_keys.py

      # The strategy pages read a build-time join of strategies.json against
      # database.json and k1.json. A stale or half-committed join renders a page
      # that is HTTP 200 and correctly laid out with its new sections silently
      # empty, which is the same failure shape as v1.22.2. This rebuilds the join
      # in memory and demands byte equality with both committed files, so it also
      # catches the .json/.js twin drift that check_database_keys.py does not.
      - name: Check the strategy extras join
        run: python3 scripts/check_strategy_extras.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build deploy folder
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='data/symphony_scores.json' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            . _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
